[project]
name = "q8s-hpc-rocm"
version = "0.1.0"
description = "ROCm-based GPU execution target plugin for running q8s jobs on HPC nodes"
authors = [{ name = "Vlad Stirbu", email = "vstirbu@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = ["q8s>=0.14.0"]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/qubernetes-dev/q8s-kernel"
Issues = "https://github.com/qubernetes-dev/q8s-kernel/issues"

[project.optional-dependencies]
development = ["pytest", "pytest-cov"]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."q8s.targets"]
hpc-rocm = "q8s_hpc_rocm.hpc_rocm_job:HpcRocmJobTemplatePlugin"
