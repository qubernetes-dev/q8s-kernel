name: Scaffold issue specifications and ADRs

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to scaffold or retry
        required: true
        type: string

permissions:
  contents: read

# Serialize ADR number allocation across issue branches.
concurrency:
  group: scaffold-issue-docs
  queue: max
  cancel-in-progress: false

jobs:
  scaffold:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'needs-spec' ||
      github.event.label.name == 'needs-adr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Execute trusted automation and templates, never code from an issue branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test documentation automation
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'
      - name: Scaffold documents and open or reuse a draft pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/scaffold-issue-docs.py
