name: Scaffold issue specifications and ADRs

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to scaffold or retry
        required: true
        type: string

permissions:
  contents: read

# Serialize ADR number allocation across issue branches.
concurrency:
  group: scaffold-issue-docs
  queue: max
  cancel-in-progress: false

jobs:
  scaffold:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'needs-spec' ||
      github.event.label.name == 'needs-adr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Scaffold documents and open or reuse a draft pull request
        uses: qubernetes-dev/sdlc-action@61c63a63148dd3a954d2b289d907a7f668d04941
        with:
          operation: scaffold
          issue-number: ${{ github.event.inputs.issue_number || '' }}
