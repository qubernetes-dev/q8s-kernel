name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    branches: ["**"]
    tags:
      - "q8s-v*"
      - "q8s-cuda-v*"
      - "q8s-hpc-cpu-v*"
      - "q8s-hpc-rocm-v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-package:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.release.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Match tag to package metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate-release-tag.py

  test:
    name: Run tests 🧪
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install q8s
        working-directory: packages/q8s
        run: >-
          python3 -m
          pip install
          .[development]

      - name: Install q8s-cuda
        working-directory: packages/q8s-cuda
        run: pip install .

      - name: Install q8s-hpc-cpu
        working-directory: packages/q8s-hpc-cpu
        run: pip install .

      - name: Install q8s-hpc-rocm
        working-directory: packages/q8s-hpc-rocm
        run: pip install .

      - name: Run tests with coverage
        run: >-
          python3 -m
          pytest packages
          --cov=q8s
          --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.10'
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true

  build:
    name: Build ${{ matrix.package }} distribution 📦
    strategy:
      fail-fast: false
      matrix:
        package: [q8s, q8s-cuda, q8s-hpc-cpu, q8s-hpc-rocm]
    needs:
      - test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tools
        run: >-
          python3 -m
          pip install
          build twine
          --user
      - name: Build a binary wheel and a source tarball
        working-directory: packages/${{ matrix.package }}
        run: python3 -m build
      - name: Validate distribution metadata
        working-directory: packages/${{ matrix.package }}
        run: python3 -m twine check --strict dist/*
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/
          if-no-files-found: error

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - release-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.release-package.outputs.package }}
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: distributions-${{ needs.release-package.outputs.package }}
          path: dist/
      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
      - publish-to-pypi
      - release-package
    runs-on: ubuntu-latest

    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for sigstore

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: distributions-${{ needs.release-package.outputs.package }}
          path: dist/
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes ""
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-to-testpypi:
    name: Publish ${{ matrix.package }} to TestPyPI
    if: github.event_name == 'push' && github.ref_type == 'branch'
    strategy:
      fail-fast: false
      matrix:
        package: [q8s, q8s-cuda, q8s-hpc-cpu, q8s-hpc-rocm]
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ matrix.package }}

    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v4
        with:
          name: distributions-${{ matrix.package }}
          path: dist/
      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true
