name: Test documentation automation

on:
  push:
    branches: ["**"]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scaffold-issue-docs.yml"
      - ".github/workflows/update-merged-doc-links.yml"
      - ".github/workflows/test-doc-automation.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/scaffold-issue-docs.yml"
      - ".github/workflows/update-merged-doc-links.yml"
      - ".github/workflows/test-doc-automation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-doc-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test documentation automation on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run documentation automation tests
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'
