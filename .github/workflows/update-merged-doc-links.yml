name: Update merged specification and ADR links

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: update-merged-doc-links-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Run only code already merged into main, including for PRs from forks.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test link synchronization
        run: python -m unittest discover -s .github/scripts/tests -p 'test_*.py'
      - name: Update linked issue bodies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/update-merged-doc-links.py
