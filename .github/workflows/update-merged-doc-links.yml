name: Update merged specification and ADR links

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: update-merged-doc-links-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Execute only the pinned action; no PR code is checked out.
      - name: Update linked issue bodies
        uses: qubernetes-dev/sdlc-action@61c63a63148dd3a954d2b289d907a7f668d04941
        with:
          operation: sync-links
